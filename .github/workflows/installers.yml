# Builds the Windows installer (.exe) and the Mac disk image (.dmg).
# Pull requests: build only, to check it works (nothing is stored).
# Push to main: the installers are kept as the run's "Artifacts" for 5 days.
# Version tag (v0.2.0 …): also published as a GitHub Release (kept for good).
# Artifact storage on the free plan is 500 MB, so only main keeps files.
name: Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: release/*.exe
          - os: macos-latest
            target: --mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package
        # Retried: electron-builder downloads its tools (NSIS, signing) from
        # GitHub, and a one-off network timeout shouldn't fail the build.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx electron-builder ${{ matrix.target }} --publish never && exit 0
            echo "Packaging failed (attempt $attempt of 3) — retrying in 30 s"
            sleep 30
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # not code-signed yet
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          retention-days: 5
          name: LV-Design-Studio-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.files }}
