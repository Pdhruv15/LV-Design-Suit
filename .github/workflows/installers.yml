# Builds the Windows installer (.exe) and the Mac disk image (.dmg).
# Runs on every push to main (download from the run's "Artifacts"), and on a
# version tag (v0.2.0 …) it also publishes a GitHub Release with both files.
name: Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: release/*.exe
          - os: macos-latest
            target: --mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # not code-signed yet
      - uses: actions/upload-artifact@v7
        with:
          name: LV-Design-Studio-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.files }}
