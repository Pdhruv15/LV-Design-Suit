name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run. Every commit on main gets its own
# complete run (grouped by commit), so nothing that lands on main goes untested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # The design report printed through Electron's Chromium, like the desktop app.
      # Linux runners have no display (xvfb) and no setuid sandbox helper.
      - name: Rendered-PDF tests
        run: xvfb-run --auto-servernum npm run test:pdf
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
