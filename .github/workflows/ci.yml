name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run. Every commit on main gets its own
# complete run (grouped by commit), so nothing that lands on main goes untested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Known high / critical advisories in what the app ships (runtime dependencies). Build and test
      # tooling (devDependencies) is not part of the installed app and is reviewed separately.
      - name: Dependency audit (shipped packages)
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Includes the engineering reference tests (src/calc/referenceCalcs.test.ts, hand-calculated values)
      # and the Python engine's OpenDSS allow-list test, which needs python3 (preinstalled on the runner).
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # Electron downloads its binary on first use (it has no install script), so fetch it here.
      # Chromium's sandbox helper must then be owned by root and setuid; set it up as Chromium
      # expects, so the PDF tests run with the sandbox on.
      - name: Chromium sandbox for Electron
        run: |
          node node_modules/electron/install.js
          test -f node_modules/electron/dist/chrome-sandbox
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      # The design report printed through Electron's Chromium, like the desktop app.
      # Linux runners have no display: xvfb provides one.
      - name: Rendered-PDF tests
        run: xvfb-run --auto-servernum npm run test:pdf
