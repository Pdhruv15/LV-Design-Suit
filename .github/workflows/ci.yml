name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run. Every commit on main gets its own
# complete run (grouped by commit), so nothing that lands on main goes untested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Dependency advisories (shipped packages and tooling, every severity) against the documented allowlist
  # (security/audit-allowlist.json, docs/engineering/dependency-audit.md), and secrets anywhere in the
  # git history. Needs only the lockfile and the history, so it runs beside the build.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the whole history, for the secret scan
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Dependency audit (allowlist)
        run: node scripts/check-audit.mjs
      # gitleaks from its GitHub release, checked against the SHA-256 published with it (pinned here).
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --exit-code 1 .

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Includes the engineering reference tests (src/calc/referenceCalcs.test.ts, hand-calculated values)
      # and the Python engine's OpenDSS allow-list test, which needs python3 (preinstalled on the runner).
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # Electron downloads its binary on first use (it has no install script), so fetch it here.
      # Chromium's sandbox helper must then be owned by root and setuid; set it up as Chromium
      # expects, so the PDF tests run with the sandbox on.
      - name: Chromium sandbox for Electron
        run: |
          node node_modules/electron/install.js
          test -f node_modules/electron/dist/chrome-sandbox
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      # The design report printed through Electron's Chromium, like the desktop app.
      # Linux runners have no display: xvfb provides one.
      - name: Rendered-PDF tests
        run: xvfb-run --auto-servernum npm run test:pdf
